name: Validate KIKI KAM
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: https://github.com/actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
      - uses: https://github.com/actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: RUN_CHART_VALIDATION=1 bash tests/validate.sh
